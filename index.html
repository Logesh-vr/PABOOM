<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta
      name="description"
      content="Your hands. A whole new instrument. Play chords and melodies with your webcam, privately on your laptop."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mein Instrument — music in your hands</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-content:center;text-align:center;background:#f4f1e9;color:#302e29;font-family:system-ui;padding:24px">
        <h1 style="font-family:Georgia,serif;font-weight:400">mein instrument</h1>
        <p id="startup-status" role="status">Preparing your playing space…</p>
        <pre id="startup-details" hidden style="max-width:600px;white-space:pre-wrap;font-size:12px"></pre>
        <button id="startup-retry" hidden onclick="location.reload()" style="padding:12px 20px;margin:auto;border:0;border-radius:6px;background:#e5a362;cursor:pointer">Reload instrument</button>
      </div>
    </div>
    <noscript>This instrument needs JavaScript enabled in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
